[project]
name = "scryfall-tags"
version = "0.1.0"
description = "Cube Classification Pipeline spike — rule-based and LLM-assisted Mechanics/Archetype tagging for Magic cards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "python-dotenv>=1.0.1",
    "anthropic>=0.40.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "types-requests>=2.33.0.20260712",
]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
